# Read-only Kalshi catalog discovery and family screening on a GitHub-hosted runner.
#
# Scheduled cloud sessions cannot reach api.elections.kalshi.com (issue #3); GitHub-hosted
# runners can. This job only runs the existing bounded, unauthenticated catalog commands:
#   entropytrade family-discover  (GET /trade-api/v2/series?category=...)
#   entropytrade family-screen    (GET /series/{T}, /markets, /historical/markets)
# Every response, including failures, is retained with a hashed manifest and uploaded.
# No secrets, credentials or order endpoints. It never selects a market family; the
# second-family choice needs the user's written approval (docs/family-selection.md).
name: family-catalog

on:
  workflow_dispatch:
    inputs:
      categories:
        description: Comma-separated Kalshi categories to list (max 12)
        default: "Economics,Financials,Politics,Climate and Weather,Science and Technology,Crypto,Companies,Entertainment,World,Health,Transportation,Sports"
      series:
        description: Space-separated series tickers to fetch and screen (confirmed from a listing)
        default: ""
      max_pages:
        description: Pages of 200 markets per endpoint per series (1-3)
        default: "3"
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/family-catalog.yml"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      OUT: data/cache/family-catalog
      CATEGORIES: ${{ github.event.inputs.categories || 'Economics,Financials,Politics,Climate and Weather,Science and Technology,Crypto,Companies,Entertainment,World,Health,Transportation,Sports' }}
      SERIES: ${{ github.event.inputs.series || '' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync

      - name: Discover series (read-only)
        if: env.CATEGORIES != ''
        run: |
          mkdir -p "$OUT"
          args=()
          IFS=',' read -ra cats <<< "$CATEGORIES"
          for c in "${cats[@]}"; do args+=(--category "$c"); done
          uv run entropytrade family-discover "${args[@]}" \
            --fetch-dir "$OUT/discovery" --output "$OUT/listing.json"

      - name: Fetch and screen confirmed series (read-only)
        if: env.SERIES != ''
        run: |
          mkdir -p "$OUT"
          fetched=()
          # One bounded run per series keeps each within the 20-request transport budget.
          for t in $SERIES; do
            uv run entropytrade family-screen --fetch-series "$t" \
              --fetch-dir "$OUT/catalog-$t" --max-pages "$MAX_PAGES" > /dev/null || true
            if [ -f "$OUT/catalog-$t/manifest.json" ]; then fetched+=(--fetched "$OUT/catalog-$t"); fi
          done
          retained=()
          for f in data/public/kalshi-public/historical-0*.json data/public/kalshi-public/markets-*.json \
                   data/public/kalshi-fees/{KXHIGHPHIL,KXNHL,KXMVECROSSCATEGORY}.json; do
            retained+=(--receipt "$f")
          done
          uv run entropytrade family-screen "${retained[@]}" "${fetched[@]}" --output "$OUT/screen.json"
          python3 - <<'PY'
          import json, os
          out = os.environ["OUT"]
          for t in os.environ["SERIES"].split():
              path = f"{out}/catalog-{t}/manifest.json"
              if os.path.exists(path):
                  calls = json.load(open(path))["calls"]
                  print(t, [(c.get("status"), c.get("bytes"), c.get("error")) for c in calls])
          report = json.load(open(f"{out}/screen.json"))
          for row in report["series"]:
              meta = row.get("series_metadata") or {}
              print("SERIES", json.dumps({
                  "series": row["series"], "title": meta.get("title"),
                  "frequency": meta.get("frequency"), "fee_type": meta.get("fee_type"),
                  "settlement_sources": meta.get("settlement_sources"),
                  "rule_examples": row.get("rule_examples"),
              }, sort_keys=True)[:4000])
          PY

      - name: Record hashes
        if: always()
        run: |
          [ -d "$OUT" ] && find "$OUT" -type f -print0 | sort -z | xargs -0 -r sha256sum || true

      - name: Upload retained receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-catalog
          path: data/cache/family-catalog
          retention-days: 90
          if-no-files-found: ignore
