# Authentic read-only forward collection on GitHub-hosted runners (issue #3).
#
# Scheduled cloud sessions cannot reach Kalshi or the weather sources; GitHub-hosted runners
# can (egress-probe run 42129099670). Each run restores the previous verified workspace
# snapshot, runs the existing private website headlessly for a bounded window
# (entropytrade.operations.forward), then stops it normally and uploads a new verified
# snapshot. Every request is an unauthenticated public GET made by the existing bounded
# adapters. No secrets, research/provider keys or exchange credentials are used; submissions
# stay disabled and there is no order transport. See docs/forward-operator.md.
name: forward-collection

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Collection window in seconds (60-3000)
        default: "1500"
      fresh:
        description: Start a NEW workspace chain even if a previous snapshot exists
        type: boolean
        default: false
      continue_from_run:
        description: >-
          Optional run ID of this workflow (any branch) whose snapshot to continue from,
          e.g. to carry a branch chain onto main. Blank uses this branch's newest snapshot.
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/forward-collection.yml"
      - "backend/src/entropytrade/operations/**"
      - "backend/src/entropytrade/execution/fee_admin.py"

permissions:
  contents: read
  actions: read

# Push runs are verification TRIALS: they get their own concurrency group, so a pending push
# can never displace a queued chain dispatch (GitHub keeps only one pending run per group;
# push 42167132149 cancelled continuation dispatch 42167131442 that way). Trials upload
# their snapshot as forward-trial-workspace and never become a chain head.
concurrency:
  group: forward-collection-${{ github.event_name == 'push' && 'trial-' || '' }}${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: bounded authentic forward collection
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      UV_LOCKED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      WORKSPACE: data/cache/forward
      OUT: data/cache/forward-out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync

      - name: Locate previous workspace snapshot
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_FROM: ${{ inputs.continue_from_run }}
          FRESH: ${{ inputs.fresh }}
        run: |
          has_snapshot() {
            # An API error fails the run instead of silently selecting an older snapshot.
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts" \
              --jq '.artifacts[] | select(.name == "forward-workspace" and (.expired | not)) | .id') \
              || { echo "::error::could not list artifacts of run $1"; exit 1; }
            [ -n "$ids" ]
          }
          found=""; source_branch="$GITHUB_REF_NAME"
          if [ -n "$CONTINUE_FROM" ]; then
            # Explicit cross-branch continuation. Fails closed: never falls back to a fresh
            # chain or to this branch's own snapshot when the named run is unusable.
            if [ "$FRESH" = "true" ]; then
              echo "::error::continue_from_run and fresh are mutually exclusive"; exit 1
            fi
            if ! printf '%s' "$CONTINUE_FROM" | grep -Eq '^[0-9]{1,20}$'; then
              echo "::error::continue_from_run must be a numeric run ID"; exit 1
            fi
            meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTINUE_FROM" \
              --jq '[.path, .head_branch, .repository.full_name, .status] | @tsv')
            IFS=$'\t' read -r path source_branch repo status <<< "$meta"
            if [ "$repo" != "$GITHUB_REPOSITORY" ] || [ "${path%%@*}" != ".github/workflows/forward-collection.yml" ]; then
              echo "::error::run $CONTINUE_FROM is not a forward-collection run of this repository"; exit 1
            fi
            if [ "$status" != "completed" ]; then
              echo "::error::run $CONTINUE_FROM has not completed ($status)"; exit 1
            fi
            if ! has_snapshot "$CONTINUE_FROM"; then
              echo "::error::run $CONTINUE_FROM has no unexpired forward-workspace snapshot"; exit 1
            fi
            found=$CONTINUE_FROM
          else
            # Most recently COMPLETED run of this workflow on this branch that uploaded an
            # unexpired snapshot. Runs on one branch are serialized (concurrency group), so
            # completion order is chain order; creation order is not (a queued dispatch can
            # be created before a push run that executes first). Failed runs still upload
            # their verified snapshot, so receipts are never skipped.
            # Push runs are trials, never chain heads, even when an older workflow version
            # uploaded them as forward-workspace (run 42162670639 started a fresh chain that
            # later pushes on its branch would otherwise have continued).
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forward-collection.yml/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .status == \"completed\" and .event != \"push\")] | sort_by(.updated_at) | reverse | .[].id")
            for id in $runs; do
              if has_snapshot "$id"; then found=$id; break; fi
            done
          fi
          echo "run_id=$found" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "Previous snapshot run: ${found:-none} (branch ${source_branch})"

      - name: Download previous snapshot
        if: steps.previous.outputs.run_id != '' && inputs.fresh != true
        uses: actions/download-artifact@v4
        with:
          name: forward-workspace
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: data/cache/forward-previous

      - name: Restore previous workspace (fails closed)
        run: |
          mkdir -p "$OUT"
          if [ -f data/cache/forward-previous/workspace.zip ]; then
            expected=$(cat data/cache/forward-previous/workspace.sha256)
            actual="sha256:$(sha256sum data/cache/forward-previous/workspace.zip | cut -d' ' -f1)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::snapshot checksum mismatch ($expected != $actual)"; exit 1
            fi
            # Refuses an incompatible uv.lock/pyproject.toml; never falls back to a fresh chain.
            uv run python -m entropytrade.api.recovery restore \
              --archive data/cache/forward-previous/workspace.zip --workspace "$WORKSPACE"
            echo "${{ steps.previous.outputs.run_id }}" > "$OUT/previous-run-id"
            echo "${{ steps.previous.outputs.source_branch }}" > "$OUT/previous-branch"
            # The source lineage travels forward so a continued chain stays traceable.
            if [ -f data/cache/forward-previous/lineage.txt ]; then
              cp data/cache/forward-previous/lineage.txt "$OUT/previous-lineage.txt"
            fi
          elif [ -n "${{ steps.previous.outputs.run_id }}" ] && [ "${{ inputs.fresh }}" != "true" ]; then
            echo "::error::previous snapshot exists but was not downloaded"; exit 1
          else
            echo "Starting a new workspace chain"
            echo "" > "$OUT/previous-run-id"
            echo "" > "$OUT/previous-branch"
          fi

      - name: Collect (bounded window)
        id: collect
        continue-on-error: true
        run: |
          seconds="${{ inputs.seconds }}"
          if [ -z "$seconds" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then seconds=900; else seconds=1500; fi
          fi
          uv run python -m entropytrade.operations.forward \
            --workspace "$WORKSPACE" --seconds "$seconds" \
            --summary "$OUT/summary.json" --log "$OUT/server.log"

      - name: Check for a workspace
        # Plain file tests, not hashFiles(): hashFiles reads whole files and is cut off after
        # 120 s, which skipped the snapshot upload of a 243 MB archive in run 42162688233.
        id: workspace
        if: always()
        run: |
          if [ -f "$WORKSPACE/jobs.sqlite" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture official fee documents (unreviewed, at most daily)
        # Runs after the server has stopped and released the workspace lease. Captures are
        # retained as immutable UNREVIEWED receipts inside the chained workspace; they never
        # certify a fee. Certification stays a local operator review (docs/fee-evidence.md).
        if: always() && steps.workspace.outputs.exists == 'true'
        continue-on-error: true
        run: |
          uv run python -m entropytrade.execution.fee_admin \
            --workspace "$WORKSPACE" --capture-due schedule rounding | tee "$OUT/fee-capture.json"

      - name: Snapshot workspace
        id: snapshot
        if: always() && steps.workspace.outputs.exists == 'true'
        run: |
          uv run python -m entropytrade.api.recovery snapshot \
            --workspace "$WORKSPACE" --archive "$OUT/workspace.zip" | tee "$OUT/snapshot.json"
          echo "sha256:$(sha256sum "$OUT/workspace.zip" | cut -d' ' -f1)" > "$OUT/workspace.sha256"
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "branch=$GITHUB_REF_NAME"
            echo "event=$GITHUB_EVENT_NAME"
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then echo "chain=trial"; else echo "chain=head"; fi
            echo "previous_run_id=$(cat "$OUT/previous-run-id")"
            echo "previous_branch=$(cat "$OUT/previous-branch")"
            echo "uv_lock=sha256:$(sha256sum uv.lock | cut -d' ' -f1)"
            echo "pyproject=sha256:$(sha256sum pyproject.toml | cut -d' ' -f1)"
          } > "$OUT/lineage.txt"
          ls -l "$OUT"
          # Set only after the archive, checksum and lineage are all written.
          echo "archive=true" >> "$GITHUB_OUTPUT"

      - name: Upload workspace snapshot
        # Only non-push runs extend the chain. A trial keeps its snapshot under a separate
        # name for inspection; chain lookup only ever selects forward-workspace.
        if: always() && steps.snapshot.outputs.archive == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'forward-trial-workspace' || 'forward-workspace' }}
          path: |
            data/cache/forward-out/workspace.zip
            data/cache/forward-out/workspace.sha256
            data/cache/forward-out/lineage.txt
            data/cache/forward-out/previous-lineage.txt
          retention-days: ${{ github.event_name == 'push' && 3 || 7 }}
          if-no-files-found: error

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-summary
          path: |
            data/cache/forward-out/summary.json
            data/cache/forward-out/server.log
            data/cache/forward-out/snapshot.json
            data/cache/forward-out/lineage.txt
            data/cache/forward-out/fee-capture.json
          retention-days: 90
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          # Printed to the log as well: sessions without artifact-storage egress read it there.
          {
            echo "## Forward collection"
            echo '```json'
            if [ -f "$OUT/summary.json" ]; then
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d.get(k) for k in ('started_at','finished_at','actions','errors','server_exit_code','monitors','schedules','retained_inputs','label_requests','alerts','submission_enabled')}, indent=2, sort_keys=True))" "$OUT/summary.json"
            else
              echo '{"summary": "missing"}'
            fi
            [ -f "$OUT/fee-capture.json" ] && cat "$OUT/fee-capture.json"
            [ -f "$OUT/snapshot.json" ] && cat "$OUT/snapshot.json"
            [ -f "$OUT/lineage.txt" ] && cat "$OUT/lineage.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
