# Authentic read-only forward collection on GitHub-hosted runners (issue #3).
#
# Scheduled cloud sessions cannot reach Kalshi or the weather sources; GitHub-hosted runners
# can (egress-probe run 42129099670). Each run restores the previous verified workspace
# snapshot, runs the existing private website headlessly for a bounded window
# (entropytrade.operations.forward), then stops it normally and uploads a new verified
# snapshot. Every request is an unauthenticated public GET made by the existing bounded
# adapters. No secrets, research/provider keys or exchange credentials are used; submissions
# stay disabled and there is no order transport. See docs/forward-operator.md.
name: forward-collection

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Collection window in seconds (60-3000)
        default: "1500"
      fresh:
        description: Start a NEW workspace chain even if a previous snapshot exists
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/forward-collection.yml"
      - "backend/src/entropytrade/operations/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: forward-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: bounded authentic forward collection
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      UV_LOCKED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      WORKSPACE: data/cache/forward
      OUT: data/cache/forward-out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync

      - name: Locate previous workspace snapshot
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest run of this workflow on this branch that uploaded an unexpired snapshot.
          # Failed runs still upload their verified snapshot, so receipts are never skipped.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forward-collection.yml/runs?branch=$GITHUB_REF_NAME&per_page=50" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id")
          found=""
          for id in $runs; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                --jq '.artifacts[] | select(.name == "forward-workspace" and (.expired | not)) | .id' | grep -q .; then
              found=$id; break
            fi
          done
          echo "run_id=$found" >> "$GITHUB_OUTPUT"
          echo "Previous snapshot run: ${found:-none}"

      - name: Download previous snapshot
        if: steps.previous.outputs.run_id != '' && inputs.fresh != true
        uses: actions/download-artifact@v4
        with:
          name: forward-workspace
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: data/cache/forward-previous

      - name: Restore previous workspace (fails closed)
        run: |
          mkdir -p "$OUT"
          if [ -f data/cache/forward-previous/workspace.zip ]; then
            expected=$(cat data/cache/forward-previous/workspace.sha256)
            actual="sha256:$(sha256sum data/cache/forward-previous/workspace.zip | cut -d' ' -f1)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::snapshot checksum mismatch ($expected != $actual)"; exit 1
            fi
            # Refuses an incompatible uv.lock/pyproject.toml; never falls back to a fresh chain.
            uv run python -m entropytrade.api.recovery restore \
              --archive data/cache/forward-previous/workspace.zip --workspace "$WORKSPACE"
            echo "${{ steps.previous.outputs.run_id }}" > "$OUT/previous-run-id"
          elif [ -n "${{ steps.previous.outputs.run_id }}" ] && [ "${{ inputs.fresh }}" != "true" ]; then
            echo "::error::previous snapshot exists but was not downloaded"; exit 1
          else
            echo "Starting a new workspace chain"
            echo "" > "$OUT/previous-run-id"
          fi

      - name: Collect (bounded window)
        id: collect
        continue-on-error: true
        run: |
          seconds="${{ inputs.seconds }}"
          if [ -z "$seconds" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then seconds=900; else seconds=1500; fi
          fi
          uv run python -m entropytrade.operations.forward \
            --workspace "$WORKSPACE" --seconds "$seconds" \
            --summary "$OUT/summary.json" --log "$OUT/server.log"

      - name: Snapshot workspace
        if: always() && hashFiles('data/cache/forward/jobs.sqlite') != ''
        run: |
          uv run python -m entropytrade.api.recovery snapshot \
            --workspace "$WORKSPACE" --archive "$OUT/workspace.zip" | tee "$OUT/snapshot.json"
          echo "sha256:$(sha256sum "$OUT/workspace.zip" | cut -d' ' -f1)" > "$OUT/workspace.sha256"
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "previous_run_id=$(cat "$OUT/previous-run-id")"
            echo "uv_lock=sha256:$(sha256sum uv.lock | cut -d' ' -f1)"
            echo "pyproject=sha256:$(sha256sum pyproject.toml | cut -d' ' -f1)"
          } > "$OUT/lineage.txt"
          ls -l "$OUT"

      - name: Upload workspace snapshot
        if: always() && hashFiles('data/cache/forward-out/workspace.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: forward-workspace
          path: |
            data/cache/forward-out/workspace.zip
            data/cache/forward-out/workspace.sha256
            data/cache/forward-out/lineage.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-summary
          path: |
            data/cache/forward-out/summary.json
            data/cache/forward-out/server.log
            data/cache/forward-out/snapshot.json
            data/cache/forward-out/lineage.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          # Printed to the log as well: sessions without artifact-storage egress read it there.
          {
            echo "## Forward collection"
            echo '```json'
            if [ -f "$OUT/summary.json" ]; then
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d.get(k) for k in ('started_at','finished_at','actions','errors','server_exit_code','monitors','schedules','retained_inputs','label_requests','alerts','submission_enabled')}, indent=2, sort_keys=True))" "$OUT/summary.json"
            else
              echo '{"summary": "missing"}'
            fi
            [ -f "$OUT/snapshot.json" ] && cat "$OUT/snapshot.json"
            [ -f "$OUT/lineage.txt" ] && cat "$OUT/lineage.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
