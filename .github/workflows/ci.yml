# Offline quality gates for every push and pull request.
#
# Uses no repository secrets, research/provider keys or exchange credentials and never
# enables submission. Manual public acquisition/browser jobs retain separate evidence;
# ordinary CI claims only its offline quality gates.
name: ci

on:
  push:
    branches: [main, "claude/**", "recovery/**", "supervisor/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      public_probe:
        description: Run only bounded anonymous public acquisition (no keys or orders)
        type: boolean
        default: false
      public_browser:
        description: Run the three public-network browser procedures without keys or orders
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || (!inputs.public_probe && !inputs.public_browser)
    name: lint, types, frontend, pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_LOCKED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check backend

      - name: Ruff format
        run: uv run ruff format --check backend

      - name: Strict mypy
        run: uv run mypy

      - name: Frontend DOM tests
        run: node --test frontend/tests/*.test.cjs

      - name: Pytest (complete offline suite)
        run: >-
          uv run pytest -p no:cacheprovider
          -o faulthandler_timeout=600
          --junitxml=pytest-results.xml

      - name: Retain pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

  public-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.public_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Run actual public research acquisition
        run: uv run python tools/research_public_probe.py --output data/cache/public-probe
      - name: Retain original public bytes, reports and restart evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-research-probe
          path: data/cache/public-probe
          if-no-files-found: error
          retention-days: 30

  public-browser:
    if: github.event_name == 'workflow_dispatch' && inputs.public_browser
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: npm ci --prefix frontend/browser --ignore-scripts --no-audit --no-fund
      - name: Install isolated pinned Chromium
        run: >-
          PLAYWRIGHT_BROWSERS_PATH="$PWD/frontend/browser/.browsers"
          node frontend/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise actual public browser flows
        shell: bash
        run: |
          set +e
          failed=0
          for spec in shadow weather-labels workbench; do
            root="$PWD/data/cache/native-public/$spec"
            mkdir -p "$root/evidence"
            ENTROPYTRADE_BROWSER_EVIDENCE="$root/evidence" \
            ENTROPYTRADE_BROWSER_WORKSPACE="$root/workspace" \
            ENTROPYTRADE_BROWSER_PYTHON="$PWD/.venv/bin/python" \
              node frontend/browser/node_modules/@playwright/test/cli.js test \
              -c frontend/browser/playwright.config.cjs "$spec.spec.cjs" \
              > "$root/runner.log" 2>&1
            result=$?
            echo "$spec exit $result"
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Retain browser reports, downloads, traces and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-regression
          path: |
            data/cache/native-public/*/evidence
            data/cache/native-public/*/runner.log
          if-no-files-found: error
          retention-days: 30
